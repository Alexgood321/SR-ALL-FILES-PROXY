name: Sync generated INCY Xray policy

on:
  push:
    branches: [main]
    paths:
      - "config/remote.conf"
      - "modules/Unified-Routing-System-DNS.sgmodule"
      - "modules/Ads-Privacy-Block.sgmodule"
      - "scripts/generate_incy_routing.py"
      - "scripts/generate_incy_xray_policy.py"
      - "tests/test_incy_xray_policy.py"
      - ".github/workflows/sync-incy-routing.yml"

permissions:
  contents: write
  statuses: write

env:
  XRAY_VERSION: v26.9.8

concurrency:
  group: incy-routing-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate, validate and publish INCY Xray policy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          allowed_path() {
            case "$1" in
              incy/xray-policy.json|incy/xray-conversion-report.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          mark_ready() {
            local artifact_sha="$1"
            local target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            local payload

            payload="$(python3 - "$target_url" <<'PY'
import json
import sys

print(json.dumps({
    "state": "success",
    "target_url": sys.argv[1],
    "description": "Validated generated INCY Xray policy",
    "context": "incy/xray-policy-ready",
}))
PY
)"

            echo "Marking INCY Xray policy READY at ${artifact_sha}"
            curl -fsS --retry 3 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${artifact_sha}" \
              -d "$payload" >/dev/null
          }

          mkdir -p /tmp/xray
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -q /tmp/xray.zip -d /tmp/xray

          for attempt in 1 2 3; do
            echo "INCY Xray sync attempt $attempt/3"

            git fetch --no-tags origin main
            git checkout -B incy-autosync origin/main

            python3 scripts/validate_shadowrocket.py
            python3 scripts/generate_incy_xray_policy.py
            python3 scripts/generate_incy_xray_policy.py \
              --write-validation-config /tmp/incy-xray-validation.json \
              --check

            python3 -m unittest discover \
              -s tests \
              -p 'test_incy_xray_policy.py' \
              -v

            XRAY_LOCATION_ASSET=/tmp/xray \
              /tmp/xray/xray run \
              -test \
              -c /tmp/incy-xray-validation.json

            mapfile -t changed_files < <(
              {
                git diff --name-only
                git ls-files --others --exclude-standard
              } | LC_ALL=C sort -u
            )

            if [ "${#changed_files[@]}" -eq 0 ]; then
              artifact_sha="$(git log -1 --format=%H -- incy/xray-policy.json)"
              if [ -z "$artifact_sha" ]; then
                echo "Unable to resolve existing INCY Xray policy commit." >&2
                exit 1
              fi
              mark_ready "$artifact_sha"
              echo "INCY Xray policy is already current and READY."
              exit 0
            fi

            for path in "${changed_files[@]}"; do
              if ! allowed_path "$path"; then
                echo "Refusing repository mutation outside generated INCY Xray artifacts: $path" >&2
                exit 1
              fi
            done

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -- \
              incy/xray-policy.json \
              incy/xray-conversion-report.md

            if git diff --cached --quiet; then
              artifact_sha="$(git log -1 --format=%H -- incy/xray-policy.json)"
              if [ -z "$artifact_sha" ]; then
                echo "Unable to resolve existing INCY Xray policy commit." >&2
                exit 1
              fi
              mark_ready "$artifact_sha"
              echo "No generated INCY Xray changes to commit; existing artifact is READY."
              exit 0
            fi

            git commit -m "Sync generated INCY Xray policy"
            artifact_sha="$(git rev-parse HEAD)"

            set +e
            git push origin HEAD:main
            push_rc=$?
            set -e

            if [ "$push_rc" -eq 0 ]; then
              mark_ready "$artifact_sha"
              echo "INCY Xray artifacts committed to main and marked READY."
              exit 0
            fi

            echo "main advanced before push; retrying from latest origin/main without force push."
          done

          echo "INCY Xray sync failed after 3 safe non-force retries." >&2
          exit 1
