name: Sync generated INCY Xray policy

on:
  push:
    branches: [main]
    paths:
      - "config/remote.conf"
      - "modules/Unified-Routing-System-DNS.sgmodule"
      - "modules/Ads-Privacy-Block.sgmodule"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: write
  statuses: write

concurrency:
  group: incy-routing-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Initialize isolated runtime path
        run: echo "ROUTING_CI_RUNTIME=$RUNNER_TEMP/vpnall-routing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Checkout reviewed event
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test publisher safety with local Git fixtures
        run: python3 -m unittest discover -s tests -p test_routing_sync_ci.py -v
      - name: Prepare pinned Xray archive and digest
        id: setup
        run: python3 scripts/routing_sync_ci.py --runtime "$ROUTING_CI_RUNTIME" --prepare-xray
      - name: Validate and publish INCY
        id: incy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/routing_sync_ci.py --runtime "$ROUTING_CI_RUNTIME" --target incy --publish
      - name: Validate and publish HAPP
        id: happ
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/routing_sync_ci.py --runtime "$ROUTING_CI_RUNTIME" --target happ --publish
      - name: Require both independent results
        if: ${{ !cancelled() }}
        env:
          SETUP: ${{ steps.setup.outcome }}
          INCY: ${{ steps.incy.outcome }}
          HAPP: ${{ steps.happ.outcome }}
        run: test "$SETUP" = success && test "$INCY" = success && test "$HAPP" = success
