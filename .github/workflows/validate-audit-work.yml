name: Validate audit work

on:
  push:
    branches:
      - work/service-audit-fixes-20260903

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
      - name: Run Shadowrocket validator
        run: python3 scripts/validate_shadowrocket.py
