name: Reorganize Spotify files once

on:
  push:
    paths:
      - '.github/workflows/reorganize-spotify-once.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Spotify files and update pinned paths
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin main
          BASE="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"
          if [ "$BASE" != "$REMOTE" ]; then
            echo "origin/main advanced before work started; refusing to overwrite"
            exit 1
          fi

          mkdir -p modules/spotify
          git mv modules/spotify-json.js modules/spotify/spotify-json.js
          git mv modules/spotify-proto.js modules/spotify/spotify-proto.js
          git mv modules/spotify-app2smile.LICENSE.md modules/spotify/LICENSE.md
          git commit -m 'Organize Spotify support files into subfolder'

          MOVE_COMMIT="$(git rev-parse HEAD)"

          python3 - "$MOVE_COMMIT" <<'PY'
          from pathlib import Path
          import sys

          move_commit = sys.argv[1]
          path = Path('modules/Spotify-Config.sgmodule')
          text = path.read_text()
          text = text.replace('modules/spotify-app2smile.LICENSE.md', 'modules/spotify/LICENSE.md')
          text = text.replace('modules/spotify-proto.js', 'modules/spotify/spotify-proto.js')
          text = text.replace('modules/spotify-json.js', 'modules/spotify/spotify-json.js')
          text = text.replace('9d1def85e7656683e0a5ad98a1078f65da8b1721', move_commit)
          path.write_text(text)
          PY

          git add modules/Spotify-Config.sgmodule
          git commit -m 'Point Spotify module to organized support files'

          git rm .github/workflows/reorganize-spotify-once.yml
          git commit -m 'Remove one-shot Spotify reorganization workflow'

          git fetch origin main
          REMOTE_NOW="$(git rev-parse origin/main)"
          if [ "$REMOTE_NOW" != "$BASE" ]; then
            echo "origin/main advanced during work; refusing non-fast-forward push"
            exit 1
          fi

          git push origin HEAD:main
