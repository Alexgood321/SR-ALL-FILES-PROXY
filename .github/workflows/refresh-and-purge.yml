name: Validate and publish jsDelivr semver alias

on:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "modules/**"
      - "scripts/validate_shadowrocket.py"
      - ".github/workflows/refresh-and-purge.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Publish stable main through semver alias
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ITERATIONS: "8"
          STABILITY_CHECKS: "3"
          STABILITY_DELAY_SECONDS: "5"
          METADATA_POLL_ROUNDS: "20"
          CDN_POLL_ROUNDS: "20"
        run: |
          set -Eeuo pipefail

          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GITHUB_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          fetch_main_head() {
            git fetch --quiet --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            git rev-parse origin/main
          }

          wait_for_stable_main() {
            local candidate
            local observed
            local check

            candidate="$(fetch_main_head)"
            echo "Stability candidate: $candidate" >&2

            for check in $(seq 1 "$STABILITY_CHECKS"); do
              sleep "$STABILITY_DELAY_SECONDS"
              observed="$(fetch_main_head)"
              echo "Stability check $check/$STABILITY_CHECKS: $observed" >&2
              if [ "$observed" != "$candidate" ]; then
                echo "main moved while settling: $candidate -> $observed" >&2
                return 2
              fi
            done

            printf '%s\n' "$candidate"
          }

          list_delivery_files() {
            local target_sha="$1"
            {
              git ls-tree -r --name-only "$target_sha" -- config/remote.conf
              git ls-tree -r --name-only "$target_sha" -- modules \
                | grep -E '^modules/[^/]+\.sgmodule$' || :
            } | LC_ALL=C sort -u
          }

          materialize_target() {
            local target_sha="$1"
            local target_dir="$2"

            mkdir -p "$target_dir"
            git archive "$target_sha" \
              config/remote.conf \
              modules \
              scripts/validate_shadowrocket.py \
              | tar -x -C "$target_dir"
          }

          relevant_changes_after_event() {
            local target_sha="$1"

            if [ "$EVENT_SHA" = "$target_sha" ]; then
              return 1
            fi

            git diff --name-only "$EVENT_SHA" "$target_sha" -- \
              config modules scripts/validate_shadowrocket.py .github/workflows/refresh-and-purge.yml \
              | grep -q .
          }

          create_or_verify_tag() {
            local version="$1"
            local target_sha="$2"
            local ref_url="https://api.github.com/repos/${REPOSITORY}/git/ref/tags/${version}"
            local create_url="https://api.github.com/repos/${REPOSITORY}/git/refs"
            local response_file
            local status
            local existing_sha
            local payload

            response_file="$(mktemp)"
            status="$(curl -sS -o "$response_file" -w '%{http_code}' "${api_headers[@]}" "$ref_url")"

            if [ "$status" = "200" ]; then
              existing_sha="$(jq -r '.object.sha // empty' "$response_file")"
              rm -f "$response_file"
              if [ "$existing_sha" = "$target_sha" ]; then
                echo "TAG EXISTS version=$version sha=$target_sha"
                return 0
              fi
              echo "Tag collision: $version points to $existing_sha, expected $target_sha" >&2
              return 1
            fi

            if [ "$status" != "404" ]; then
              echo "Failed to inspect tag $version (HTTP $status)" >&2
              sed -n '1,40p' "$response_file" >&2 || :
              rm -f "$response_file"
              return 1
            fi

            payload="$(jq -cn --arg ref "refs/tags/${version}" --arg sha "$target_sha" '{ref:$ref,sha:$sha}')"
            status="$(curl -sS -o "$response_file" -w '%{http_code}' \
              -X POST "${api_headers[@]}" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$create_url")"

            if [ "$status" = "201" ]; then
              echo "TAG CREATED version=$version sha=$target_sha"
              rm -f "$response_file"
              return 0
            fi

            echo "Failed to create tag $version (HTTP $status)" >&2
            sed -n '1,40p' "$response_file" >&2 || :
            rm -f "$response_file"
            return 1
          }

          resolved_latest() {
            curl -fsS \
              "https://data.jsdelivr.com/v1/packages/gh/${REPOSITORY}/resolved?specifier=latest" \
              | jq -r '.version // empty'
          }

          version_ge() {
            local left="${1#v}"
            local right="${2#v}"
            [ "$(printf '%s\n%s\n' "$left" "$right" | sort -V | tail -n1)" = "$left" ]
          }

          poll_delay() {
            local round="$1"
            case "$round" in
              1) echo 2 ;;
              2) echo 4 ;;
              3) echo 6 ;;
              4) echo 8 ;;
              5) echo 10 ;;
              *) echo 15 ;;
            esac
          }

          wait_for_latest_metadata() {
            local version="$1"
            local target_sha="$2"
            local round
            local resolved
            local observed
            local delay

            for round in $(seq 1 "$METADATA_POLL_ROUNDS"); do
              observed="$(fetch_main_head)"
              if [ "$observed" != "$target_sha" ]; then
                echo "main advanced while waiting for jsDelivr metadata: $target_sha -> $observed"
                return 2
              fi

              resolved="$(resolved_latest || true)"
              echo "jsDelivr metadata round $round/$METADATA_POLL_ROUNDS: latest=${resolved:-NONE}"

              if [ -n "$resolved" ] && version_ge "$resolved" "$version"; then
                echo "jsDelivr latest metadata reached version $resolved (required >= $version)"
                return 0
              fi

              if [ "$round" -lt "$METADATA_POLL_ROUNDS" ]; then
                delay="$(poll_delay "$round")"
                sleep "$delay"
              fi
            done

            echo "jsDelivr metadata did not expose $version or a newer semver version in time." >&2
            return 1
          }

          verify_url_file() {
            local url="$1"
            local expected_file="$2"
            local body_file
            local headers_file
            local status="000"
            local expected_sha
            local actual_sha

            body_file="$(mktemp)"
            headers_file="$(mktemp)"

            if status="$(curl -sS -L -D "$headers_file" -o "$body_file" -w '%{http_code}' "$url")"; then
              if [ "$status" = "200" ] \
                 && [ -s "$body_file" ] \
                 && ! head -c 512 "$body_file" | grep -qiE '<!doctype html|<html' \
                 && cmp -s "$body_file" "$expected_file"; then
                expected_sha="$(sha256sum "$expected_file" | awk '{print $1}')"
                echo "MATCH $url sha256=$expected_sha"
                rm -f "$body_file" "$headers_file"
                return 0
              fi
            fi

            expected_sha="$(sha256sum "$expected_file" | awk '{print $1}')"
            if [ -s "$body_file" ]; then
              actual_sha="$(sha256sum "$body_file" | awk '{print $1}')"
            else
              actual_sha="EMPTY"
            fi
            echo "MISMATCH $url HTTP=$status expected=$expected_sha actual=$actual_sha"
            rm -f "$body_file" "$headers_file"
            return 1
          }

          verify_version_files() {
            local version="$1"
            local expected_dir="$2"
            shift 2
            local paths=("$@")
            local path
            local round
            local delay
            local all_match

            for round in $(seq 1 "$CDN_POLL_ROUNDS"); do
              all_match=true
              echo "Immutable version verification round $round/$CDN_POLL_ROUNDS for $version"

              for path in "${paths[@]}"; do
                if ! verify_url_file \
                  "https://cdn.jsdelivr.net/gh/${REPOSITORY}@${version}/${path}" \
                  "$expected_dir/$path"; then
                  all_match=false
                fi
              done

              if [ "$all_match" = true ]; then
                return 0
              fi

              if [ "$round" -lt "$CDN_POLL_ROUNDS" ]; then
                delay="$(poll_delay "$round")"
                sleep "$delay"
              fi
            done

            return 1
          }

          purge_latest_path() {
            local path="$1"
            local purge_url="https://purge.jsdelivr.net/gh/${REPOSITORY}@latest/${path}"
            local response_file
            local status="000"

            response_file="$(mktemp)"
            for attempt in 1 2 3; do
              status="$(curl -sS -o "$response_file" -w '%{http_code}' "$purge_url" || true)"
              if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                echo "PURGED @latest $path HTTP=$status"
                rm -f "$response_file"
                return 0
              fi
              echo "Purge @latest attempt $attempt/3 failed for $path HTTP=$status"
              sleep $((attempt * 2))
            done

            echo "Purge @latest failed for $path after 3 attempts." >&2
            sed -n '1,40p' "$response_file" >&2 || :
            rm -f "$response_file"
            return 1
          }

          verify_latest_files() {
            local target_sha="$1"
            local expected_dir="$2"
            shift 2
            local paths=("$@")
            local path
            local round
            local delay
            local all_match
            local observed

            for round in $(seq 1 "$CDN_POLL_ROUNDS"); do
              observed="$(fetch_main_head)"
              if [ "$observed" != "$target_sha" ]; then
                echo "main advanced while verifying @latest: $target_sha -> $observed"
                return 2
              fi

              all_match=true
              echo "@latest verification round $round/$CDN_POLL_ROUNDS"

              for path in "${paths[@]}"; do
                if ! verify_url_file \
                  "https://cdn.jsdelivr.net/gh/${REPOSITORY}@latest/${path}" \
                  "$expected_dir/$path"; then
                  all_match=false
                fi
              done

              observed="$(fetch_main_head)"
              if [ "$observed" != "$target_sha" ]; then
                echo "main advanced during @latest verification: $target_sha -> $observed"
                return 2
              fi

              if [ "$all_match" = true ]; then
                return 0
              fi

              if [ "$round" -lt "$CDN_POLL_ROUNDS" ]; then
                delay="$(poll_delay "$round")"
                sleep "$delay"
              fi
            done

            return 1
          }

          echo "Event SHA: $EVENT_SHA"
          echo "Workflow run number: $RUN_NUMBER"

          for iteration in $(seq 1 "$MAX_ITERATIONS"); do
            echo "========== semver reconciliation iteration $iteration/$MAX_ITERATIONS =========="

            set +e
            TARGET_SHA="$(wait_for_stable_main)"
            settle_rc=$?
            set -e

            if [ "$settle_rc" -eq 2 ]; then
              echo "main is still moving; restarting"
              continue
            elif [ "$settle_rc" -ne 0 ]; then
              exit "$settle_rc"
            fi

            VERSION="1.${RUN_NUMBER}.${iteration}"
            echo "TARGET_SHA=$TARGET_SHA"
            echo "VERSION=$VERSION"

            expected_dir="$(mktemp -d)"
            materialize_target "$TARGET_SHA" "$expected_dir"
            mapfile -t delivery_files < <(list_delivery_files "$TARGET_SHA")

            if [ "${#delivery_files[@]}" -eq 0 ]; then
              echo "No delivery files found at $TARGET_SHA" >&2
              rm -rf "$expected_dir"
              exit 1
            fi

            echo "Delivery files:"
            printf '  %s\n' "${delivery_files[@]}"

            echo "Validating TARGET_SHA=$TARGET_SHA"
            (
              cd "$expected_dir"
              python3 scripts/validate_shadowrocket.py
            )

            create_or_verify_tag "$VERSION" "$TARGET_SHA"

            set +e
            wait_for_latest_metadata "$VERSION" "$TARGET_SHA"
            metadata_rc=$?
            set -e

            if [ "$metadata_rc" -eq 2 ]; then
              rm -rf "$expected_dir"
              continue
            elif [ "$metadata_rc" -ne 0 ]; then
              rm -rf "$expected_dir"
              exit "$metadata_rc"
            fi

            echo "Verifying immutable jsDelivr version @$VERSION"
            if ! verify_version_files "$VERSION" "$expected_dir" "${delivery_files[@]}"; then
              echo "Immutable jsDelivr version @$VERSION did not match TARGET_SHA=$TARGET_SHA." >&2
              rm -rf "$expected_dir"
              exit 1
            fi

            publisher=true
            if relevant_changes_after_event "$TARGET_SHA"; then
              publisher=false
            fi

            if [ "$publisher" = true ]; then
              echo "ROLE=PUBLISHER event=$EVENT_SHA target=$TARGET_SHA version=$VERSION"
              for path in "${delivery_files[@]}"; do
                purge_latest_path "$path"
              done
            else
              echo "ROLE=OBSERVER event=$EVENT_SHA target=$TARGET_SHA version=$VERSION"
              echo "A newer relevant main change exists; this run will not purge @latest."
            fi

            set +e
            verify_latest_files "$TARGET_SHA" "$expected_dir" "${delivery_files[@]}"
            latest_rc=$?
            set -e

            rm -rf "$expected_dir"

            if [ "$latest_rc" -eq 0 ]; then
              END_SHA="$(fetch_main_head)"
              echo "END_SHA=$END_SHA"
              if [ "$END_SHA" = "$TARGET_SHA" ]; then
                echo "SEMVER RECONCILIATION SUCCESS: @latest == stable main HEAD $TARGET_SHA via version $VERSION"
                exit 0
              fi
              echo "main advanced after exact @latest verification: $TARGET_SHA -> $END_SHA"
              continue
            elif [ "$latest_rc" -eq 2 ]; then
              echo "main advanced while verifying @latest; restarting"
              continue
            fi

            echo "SEMVER RECONCILIATION FAILED: @latest did not converge to stable TARGET_SHA=$TARGET_SHA." >&2
            exit 1
          done

          FINAL_HEAD="$(fetch_main_head)"
          echo "SEMVER RECONCILIATION FAILED: main did not stay stable within $MAX_ITERATIONS attempts." >&2
          echo "Latest observed main HEAD: $FINAL_HEAD" >&2
          exit 1
