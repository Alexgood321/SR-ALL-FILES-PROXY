name: Validate and publish GitHub release delivery

on:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "modules/**"
      - "scripts/validate_shadowrocket.py"
      - ".github/workflows/refresh-and-purge.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Publish stable main as release assets
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ITERATIONS: "8"
          STABILITY_CHECKS: "3"
          STABILITY_DELAY_SECONDS: "5"
          LATEST_POLL_ROUNDS: "12"
        run: |
          set -Eeuo pipefail

          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GITHUB_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          fetch_main_head() {
            git fetch --quiet --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            git rev-parse origin/main
          }

          wait_for_stable_main() {
            local candidate observed check
            candidate="$(fetch_main_head)"
            echo "Stability candidate: $candidate" >&2

            for check in $(seq 1 "$STABILITY_CHECKS"); do
              sleep "$STABILITY_DELAY_SECONDS"
              observed="$(fetch_main_head)"
              echo "Stability check $check/$STABILITY_CHECKS: $observed" >&2
              if [ "$observed" != "$candidate" ]; then
                echo "main moved while settling: $candidate -> $observed" >&2
                return 2
              fi
            done

            printf '%s\n' "$candidate"
          }

          list_delivery_files() {
            local target_sha="$1"
            {
              git ls-tree -r --name-only "$target_sha" -- config/remote.conf
              git ls-tree -r --name-only "$target_sha" -- modules \
                | grep -E '^modules/[^/]+\.sgmodule$' || :
            } | LC_ALL=C sort -u
          }

          materialize_target() {
            local target_sha="$1" target_dir="$2"
            mkdir -p "$target_dir"
            git archive "$target_sha" \
              config/remote.conf \
              modules \
              scripts/validate_shadowrocket.py \
              | tar -x -C "$target_dir"
          }

          relevant_changes_after_event() {
            local target_sha="$1"
            if [ "$EVENT_SHA" = "$target_sha" ]; then
              return 1
            fi

            git diff --name-only "$EVENT_SHA" "$target_sha" -- \
              config modules scripts/validate_shadowrocket.py .github/workflows/refresh-and-purge.yml \
              | grep -q .
          }

          poll_delay() {
            case "$1" in
              1) echo 2 ;;
              2) echo 4 ;;
              3) echo 6 ;;
              4) echo 8 ;;
              5) echo 10 ;;
              *) echo 15 ;;
            esac
          }

          version_ge() {
            local left="${1#v}" right="${2#v}"
            [ "$(printf '%s\n%s\n' "$left" "$right" | sort -V | tail -n1)" = "$left" ]
          }

          get_or_create_release() {
            local version="$1" target_sha="$2"
            local response_file status release_id tag_sha payload
            response_file="$(mktemp)"

            status="$(curl -sS -o "$response_file" -w '%{http_code}' \
              "${api_headers[@]}" \
              "https://api.github.com/repos/${REPOSITORY}/releases/tags/${version}")"

            if [ "$status" = "200" ]; then
              release_id="$(jq -r '.id // empty' "$response_file")"
              rm -f "$response_file"
              tag_sha="$(curl -fsS "${api_headers[@]}" \
                "https://api.github.com/repos/${REPOSITORY}/git/ref/tags/${version}" \
                | jq -r '.object.sha // empty')"
              if [ -z "$release_id" ] || [ "$tag_sha" != "$target_sha" ]; then
                echo "Existing release/tag mismatch for $version: tag_sha=$tag_sha target=$target_sha" >&2
                return 1
              fi
              echo "RELEASE EXISTS version=$version id=$release_id sha=$target_sha" >&2
              printf '%s\n' "$release_id"
              return 0
            fi

            if [ "$status" != "404" ]; then
              echo "Failed to inspect release $version HTTP=$status" >&2
              sed -n '1,40p' "$response_file" >&2 || :
              rm -f "$response_file"
              return 1
            fi

            payload="$(jq -cn \
              --arg tag "$version" \
              --arg sha "$target_sha" \
              --arg name "Shadowrocket delivery $version" \
              --arg body "Immutable delivery snapshot for $target_sha" \
              '{tag_name:$tag,target_commitish:$sha,name:$name,body:$body,draft:false,prerelease:false,make_latest:"legacy"}')"

            status="$(curl -sS -o "$response_file" -w '%{http_code}' \
              -X POST "${api_headers[@]}" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.github.com/repos/${REPOSITORY}/releases")"

            if [ "$status" != "201" ]; then
              echo "Failed to create release $version HTTP=$status" >&2
              sed -n '1,80p' "$response_file" >&2 || :
              rm -f "$response_file"
              return 1
            fi

            release_id="$(jq -r '.id // empty' "$response_file")"
            rm -f "$response_file"
            if [ -z "$release_id" ]; then
              echo "Release $version created without an id" >&2
              return 1
            fi

            echo "RELEASE CREATED version=$version id=$release_id sha=$target_sha" >&2
            printf '%s\n' "$release_id"
          }

          upload_or_verify_asset() {
            local release_id="$1" name="$2" file="$3"
            local expected_sha expected_size assets_file existing_id existing_digest existing_size encoded_name
            local response_file status

            expected_sha="$(sha256sum "$file" | awk '{print $1}')"
            expected_size="$(wc -c < "$file" | tr -d ' ')"
            assets_file="$(mktemp)"

            curl -fsS "${api_headers[@]}" \
              "https://api.github.com/repos/${REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              > "$assets_file"

            existing_id="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .id' "$assets_file" | head -n1)"
            if [ -n "$existing_id" ]; then
              existing_digest="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .digest // ""' "$assets_file" | head -n1)"
              existing_size="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .size // 0' "$assets_file" | head -n1)"
              rm -f "$assets_file"
              if [ "$existing_digest" = "sha256:${expected_sha}" ] && [ "$existing_size" = "$expected_size" ]; then
                echo "ASSET EXISTS MATCH name=$name sha256=$expected_sha"
                return 0
              fi
              echo "Existing asset mismatch in immutable release: $name digest=$existing_digest size=$existing_size" >&2
              return 1
            fi
            rm -f "$assets_file"

            encoded_name="$(jq -rn --arg v "$name" '$v|@uri')"
            response_file="$(mktemp)"
            status="$(curl -sS -o "$response_file" -w '%{http_code}' \
              -X POST "${api_headers[@]}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${REPOSITORY}/releases/${release_id}/assets?name=${encoded_name}")"

            if [ "$status" != "201" ]; then
              echo "Failed to upload release asset $name HTTP=$status" >&2
              sed -n '1,80p' "$response_file" >&2 || :
              rm -f "$response_file"
              return 1
            fi

            actual_digest="$(jq -r '.digest // empty' "$response_file")"
            rm -f "$response_file"
            if [ "$actual_digest" != "sha256:${expected_sha}" ]; then
              echo "Uploaded asset digest mismatch: $name expected=sha256:$expected_sha actual=$actual_digest" >&2
              return 1
            fi
            echo "ASSET UPLOADED MATCH name=$name sha256=$expected_sha"
          }

          verify_download() {
            local url="$1" expected_file="$2"
            local body_file status expected_sha actual_sha
            body_file="$(mktemp)"
            status="$(curl -sS -L -o "$body_file" -w '%{http_code}' "$url" || true)"
            expected_sha="$(sha256sum "$expected_file" | awk '{print $1}')"

            if [ "$status" = "200" ] && [ -s "$body_file" ] && cmp -s "$body_file" "$expected_file"; then
              echo "DOWNLOAD MATCH url=$url sha256=$expected_sha"
              rm -f "$body_file"
              return 0
            fi

            if [ -s "$body_file" ]; then
              actual_sha="$(sha256sum "$body_file" | awk '{print $1}')"
            else
              actual_sha="EMPTY"
            fi
            echo "DOWNLOAD MISMATCH url=$url HTTP=$status expected=$expected_sha actual=$actual_sha"
            rm -f "$body_file"
            return 1
          }

          verify_immutable_release() {
            local version="$1" expected_dir="$2"
            shift 2
            local paths=("$@") path name
            for path in "${paths[@]}"; do
              name="$(basename "$path")"
              verify_download \
                "https://github.com/${REPOSITORY}/releases/download/${version}/${name}" \
                "$expected_dir/$path" || return 1
            done
          }

          wait_and_verify_latest_release() {
            local required_version="$1" target_sha="$2" expected_dir="$3"
            shift 3
            local paths=("$@") round latest_json latest_tag latest_sha path name all_match observed delay

            for round in $(seq 1 "$LATEST_POLL_ROUNDS"); do
              observed="$(fetch_main_head)"
              if [ "$observed" != "$target_sha" ]; then
                echo "main advanced while checking latest release: $target_sha -> $observed"
                return 2
              fi

              latest_json="$(mktemp)"
              if ! curl -fsS "${api_headers[@]}" \
                "https://api.github.com/repos/${REPOSITORY}/releases/latest" > "$latest_json"; then
                rm -f "$latest_json"
                latest_tag=""
                latest_sha=""
              else
                latest_tag="$(jq -r '.tag_name // empty' "$latest_json")"
                rm -f "$latest_json"
                if [ -n "$latest_tag" ]; then
                  latest_sha="$(curl -fsS "${api_headers[@]}" \
                    "https://api.github.com/repos/${REPOSITORY}/git/ref/tags/${latest_tag}" \
                    | jq -r '.object.sha // empty' || true)"
                else
                  latest_sha=""
                fi
              fi

              echo "Latest release round $round/$LATEST_POLL_ROUNDS: tag=${latest_tag:-NONE} sha=${latest_sha:-NONE}"

              all_match=false
              if [ -n "$latest_tag" ] && version_ge "$latest_tag" "$required_version" && [ "$latest_sha" = "$target_sha" ]; then
                all_match=true
                for path in "${paths[@]}"; do
                  name="$(basename "$path")"
                  if ! verify_download \
                    "https://github.com/${REPOSITORY}/releases/latest/download/${name}" \
                    "$expected_dir/$path"; then
                    all_match=false
                  fi
                done
              fi

              observed="$(fetch_main_head)"
              if [ "$observed" != "$target_sha" ]; then
                echo "main advanced during latest release verification: $target_sha -> $observed"
                return 2
              fi

              if [ "$all_match" = true ]; then
                return 0
              fi

              if [ "$round" -lt "$LATEST_POLL_ROUNDS" ]; then
                delay="$(poll_delay "$round")"
                sleep "$delay"
              fi
            done

            return 1
          }

          echo "Event SHA: $EVENT_SHA"
          echo "Workflow run number: $RUN_NUMBER"

          for iteration in $(seq 1 "$MAX_ITERATIONS"); do
            echo "========== release reconciliation iteration $iteration/$MAX_ITERATIONS =========="

            set +e
            TARGET_SHA="$(wait_for_stable_main)"
            settle_rc=$?
            set -e
            if [ "$settle_rc" -eq 2 ]; then
              echo "main is still moving; restarting"
              continue
            elif [ "$settle_rc" -ne 0 ]; then
              exit "$settle_rc"
            fi

            VERSION="v2.${RUN_NUMBER}.${iteration}"
            echo "TARGET_SHA=$TARGET_SHA"
            echo "VERSION=$VERSION"

            expected_dir="$(mktemp -d)"
            materialize_target "$TARGET_SHA" "$expected_dir"
            mapfile -t delivery_files < <(list_delivery_files "$TARGET_SHA")
            if [ "${#delivery_files[@]}" -eq 0 ]; then
              echo "No delivery files found at $TARGET_SHA" >&2
              rm -rf "$expected_dir"
              exit 1
            fi

            mapfile -t asset_names < <(printf '%s\n' "${delivery_files[@]}" | xargs -n1 basename)
            if [ "$(printf '%s\n' "${asset_names[@]}" | sort | uniq -d | wc -l)" -ne 0 ]; then
              echo "Delivery basenames are not unique; release asset URLs would collide." >&2
              printf '%s\n' "${asset_names[@]}" >&2
              rm -rf "$expected_dir"
              exit 1
            fi

            echo "Delivery files:"
            printf '  %s\n' "${delivery_files[@]}"

            echo "Validating TARGET_SHA=$TARGET_SHA"
            (
              cd "$expected_dir"
              python3 scripts/validate_shadowrocket.py
            )

            publisher=true
            if relevant_changes_after_event "$TARGET_SHA"; then
              publisher=false
            fi

            if [ "$publisher" = true ]; then
              echo "ROLE=PUBLISHER event=$EVENT_SHA target=$TARGET_SHA version=$VERSION"
              release_id="$(get_or_create_release "$VERSION" "$TARGET_SHA")"
              echo "RELEASE_ID=$release_id"

              for path in "${delivery_files[@]}"; do
                upload_or_verify_asset "$release_id" "$(basename "$path")" "$expected_dir/$path"
              done

              echo "Verifying immutable release $VERSION"
              verify_immutable_release "$VERSION" "$expected_dir" "${delivery_files[@]}"
            else
              echo "ROLE=OBSERVER event=$EVENT_SHA target=$TARGET_SHA version=$VERSION"
              echo "A newer relevant main change exists; this run will not create a release."
            fi

            set +e
            wait_and_verify_latest_release "$VERSION" "$TARGET_SHA" "$expected_dir" "${delivery_files[@]}"
            latest_rc=$?
            set -e
            rm -rf "$expected_dir"

            if [ "$latest_rc" -eq 0 ]; then
              END_SHA="$(fetch_main_head)"
              echo "END_SHA=$END_SHA"
              if [ "$END_SHA" = "$TARGET_SHA" ]; then
                echo "RELEASE RECONCILIATION SUCCESS: latest release assets == stable main HEAD $TARGET_SHA"
                exit 0
              fi
              echo "main advanced after exact latest-release verification: $TARGET_SHA -> $END_SHA"
              continue
            elif [ "$latest_rc" -eq 2 ]; then
              echo "main advanced while verifying latest release; restarting"
              continue
            fi

            echo "RELEASE RECONCILIATION FAILED: latest release did not converge to stable TARGET_SHA=$TARGET_SHA." >&2
            exit 1
          done

          FINAL_HEAD="$(fetch_main_head)"
          echo "RELEASE RECONCILIATION FAILED: main did not stay stable within $MAX_ITERATIONS attempts." >&2
          echo "Latest observed main HEAD: $FINAL_HEAD" >&2
          exit 1
