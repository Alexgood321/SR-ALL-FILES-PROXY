name: Validate INCY Xray policy

on:
  push:
    branches: [main]
    paths:
      - "config/remote.conf"
      - "modules/Unified-Routing-System-DNS.sgmodule"
      - "modules/Ads-Privacy-Block.sgmodule"
      - "scripts/**"
      - "tests/**"
      - "incy/**"
      - "happ/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "config/remote.conf"
      - "modules/Unified-Routing-System-DNS.sgmodule"
      - "modules/Ads-Privacy-Block.sgmodule"
      - "scripts/**"
      - "tests/**"
      - "incy/**"
      - "happ/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Initialize isolated runtime path
        run: echo "ROUTING_CI_RUNTIME=$RUNNER_TEMP/vpnall-validation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI safety with local Git fixtures
        run: python3 -m unittest discover -s tests -p test_routing_sync_ci.py -v
      - name: Select source or original-artifact validation independently
        id: mode
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for target in incy happ; do
            mode=source
            if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
              mode=artifact
            elif ! git diff --quiet "$BASE" HEAD -- "$target/xray-policy.json" "$target/xray-conversion-report.md"; then
              mode=artifact
            fi
            echo "$target=$mode" >> "$GITHUB_OUTPUT"
          done
      - name: Prepare pinned Xray archive and digest
        id: setup
        run: python3 scripts/routing_sync_ci.py --runtime "$ROUTING_CI_RUNTIME" --prepare-xray
      - name: Validate INCY
        id: incy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.mode.outcome == 'success' }}
        continue-on-error: true
        env:
          MODE: ${{ steps.mode.outputs.incy }}
        run: python3 scripts/routing_sync_ci.py --runtime "$ROUTING_CI_RUNTIME" --target incy --mode "$MODE"
      - name: Validate HAPP
        id: happ
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.mode.outcome == 'success' }}
        continue-on-error: true
        env:
          MODE: ${{ steps.mode.outputs.happ }}
        run: python3 scripts/routing_sync_ci.py --runtime "$ROUTING_CI_RUNTIME" --target happ --mode "$MODE"
      - name: Require both independent results
        if: ${{ !cancelled() }}
        env:
          SETUP: ${{ steps.setup.outcome }}
          MODE: ${{ steps.mode.outcome }}
          INCY: ${{ steps.incy.outcome }}
          HAPP: ${{ steps.happ.outcome }}
        run: test "$SETUP" = success && test "$MODE" = success && test "$INCY" = success && test "$HAPP" = success
