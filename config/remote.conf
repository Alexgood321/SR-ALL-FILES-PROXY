RULE-SET,https://cdn.jsdelivr.net/gh/Alexgood321/SR-ALL-FILES-PROXY@main/rules/VK-Direct-Stable-Privacy-DNS-Test-REJECT-TINYGIF.list,REJECT-TINYGIF,update-interval=120
RULE-SET,https://cdn.jsdelivr.net/gh/Alexgood321/SR-ALL-FILES-PROXY@main/rules/VK-Direct-Stable-Privacy-DNS-Test-REJECT-DICT.list,REJECT-DICT,update-interval=120
RULE-SET,https://cdn.jsdelivr.net/gh/Alexgood321/SR-ALL-FILES-PROXY@main/rules/VK-Direct-Stable-Privacy-DNS-Test-REJECT.list,REJECT,update-interval=120
RULE-SET,https://cdn.jsdelivr.net/gh/Alexgood321/SR-ALL-FILES-PROXY@main/rules/VK-Direct-Stable-Privacy-DNS-Test-REJECT-200.list,REJECT-200,update-interval=120

# Модули DIRECT
